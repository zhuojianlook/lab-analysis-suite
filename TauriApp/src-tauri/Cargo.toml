[package]
name = "app"
version = "0.1.0"
description = "Lab Analysis Suite"
authors = ["zhuojianlook"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "~2.10.3", features = ["devtools"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "~2.6.0"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
reqwest = { version = "0.12", features = ["json", "multipart"] }
url = "2"
# Analysis files (.lag): ZIP container (deflate through flate2's pure-Rust
# backend; zip's own "deflate" feature would pull zopfli + zlib-rs), hashes, ids.
zip = { version = "~4.6", default-features = false, features = ["deflate-flate2"] }
flate2 = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# Default features off: the lock already has these crates with the features tao uses.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std"] }
